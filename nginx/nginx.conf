worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;
  server_tokens off;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    text/plain text/css text/xml application/json application/javascript
    application/xml image/svg+xml application/rss+xml font/truetype font/opentype;

  # Basic cache for hashed static assets
  map $sent_http_content_type $expires {
    default                    off;
    text/html                  epoch;
    text/css                   7d;
    application/javascript     7d;
    ~image/                    30d;
    ~font/                     30d;
  }

  upstream socialiq_api {
    least_conn;
    server backend:5000 max_fails=3 fail_timeout=30s;
    # Add more API replicas for load balancing:
    # server backend2:5000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  # HTTP → HTTPS redirect (enable when TLS certificates are mounted)
  server {
    listen 80;
    server_name _;

    # Uncomment when certs are available:
    # return 301 https://$host$request_uri;

    # Dev / Docker HTTP mode: serve app + proxy API
    include /etc/nginx/conf.d/socialiq_locations.conf;
  }

  # HTTPS server (production)
  # server {
  #   listen 443 ssl http2;
  #   server_name api.example.com app.example.com;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_session_cache shared:SSL:10m;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   include /etc/nginx/conf.d/socialiq_locations.conf;
  # }
}
