name: Continuous Deployment

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
    branches: [development, staging, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [development, staging, production]

permissions:
  contents: read
  deployments: write

jobs:
  prepare:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            BR="${{ github.event.workflow_run.head_branch }}"
            case "$BR" in
              development) echo "environment=development" >> "$GITHUB_OUTPUT" ;;
              staging) echo "environment=staging" >> "$GITHUB_OUTPUT" ;;
              main) echo "environment=production" >> "$GITHUB_OUTPUT" ;;
              *) echo "environment=development" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.prepare.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy backend (Railway)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN not set — skipping Railway deploy (configure secret to enable)."
            exit 0
          fi
          npm i -g @railway/cli
          railway up --service "${{ secrets.RAILWAY_SERVICE_ID }}" --detach || railway up --detach

      - name: Deploy frontend (Vercel)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set — skipping Vercel deploy (configure secrets to enable)."
            exit 0
          fi
          npm i -g vercel
          if [ "${{ needs.prepare.outputs.environment }}" = "production" ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            vercel build --prod --token="$VERCEL_TOKEN"
            vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
            vercel build --token="$VERCEL_TOKEN"
            vercel deploy --prebuilt --token="$VERCEL_TOKEN"
          fi

      - name: Health check (API)
        env:
          HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "API_HEALTH_URL secret not set — skipping health verification."
            exit 0
          fi
          for i in 1 2 3 4 5; do
            if curl -fsS "$HEALTH_URL" | grep -qi success; then
              echo "Health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed — initiate rollback via Railway/Vercel previous deployment."
          exit 1

      - name: Rollback guidance
        if: failure()
        run: |
          echo "::error::Deployment verification failed. Rollback: redeploy previous Git SHA on Railway and Vercel; see docs/Deployment.md"
