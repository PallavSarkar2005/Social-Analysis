name: Continuous Integration

on:
  push:
    branches: [main, development, staging]
  pull_request:
    branches: [main, development, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Unit & integration tests
        run: npm test
        env:
          NODE_ENV: test
          # Tests that need env should provide their own mocks; placeholders avoid accidental prod calls
          MONGO_URI: mongodb://127.0.0.1:27017/socialiq_test
          GROQ_API_KEY: test_groq_key_not_real
          JWT_SECRET: ci_test_jwt_secret_at_least_32_chars
          YOUTUBE_API_KEY: test_youtube_key_not_real

      - name: Backend build script
        run: npm run build

      - name: Dependency audit (backend)
        run: npm audit --audit-level=high || true

  frontend:
    name: Frontend lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit / component tests
        run: npx vitest run

      - name: Type check
        run: |
          echo "Project is JavaScript (ESM). No tsc step. ESLint covers static analysis."

      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000
          VITE_RAZORPAY_KEY_ID: rzp_test_placeholder

      - name: Dependency audit (frontend)
        run: npm audit --audit-level=high || true

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker-build:
    name: Docker image smoke build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t socialiq-api:ci .
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t socialiq-web:ci --build-arg VITE_API_URL=http://localhost:5000 .
