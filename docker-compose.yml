# Development stack: MongoDB + API + web (nginx SPA)
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/socialiq
      CLIENT_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    # Explanation: Express API, cron jobs, Razorpay/AI/YouTube integrations

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:5000
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    # Explanation: Nginx serves Vite build; can proxy /api when VITE_API_URL points at same origin

volumes:
  mongo_data:
